name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:harness
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

  # 実ブラウザー検証を品質・build検証から分け、両方の成否を確認できるようにする。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload service lifecycle screenshots
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: service-account-lifecycle-screenshots
          path: test-results/**/lifecycle-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
